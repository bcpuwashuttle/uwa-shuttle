<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1C47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UWA Shuttle">
<title>UWA Shuttle</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root {
    --night: #1B1C47;
    --panel: #25265C;
    --line: #3F4096;
    --lilac: #A9AAE0;
    --orange: #F58735;
    --white: #FFFFFF;
    --muted: #9FA0CF;
    --danger: #FF8A8A;
    --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    --body: "Barlow", Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--white); font-family: var(--body); }
  body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  .app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  header { background: var(--white); padding: 5px 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 10px; }
  header img { height: 34px; width: auto; display: block; }
  header img { grid-row: 1; grid-column: 1; justify-self: start; }
  header .dt { display: contents; font-family: var(--cond); font-weight: 700; }
  header .clock { grid-row: 1; grid-column: 2; justify-self: center; color: #373535; font-variant-numeric: tabular-nums; font-size: clamp(28px, 8vw, 38px); line-height: 1; }
  header .date { grid-row: 1; grid-column: 3; justify-self: end; color: var(--line); font-size: clamp(15px, 4.4vw, 19px); line-height: 1; }

  main { flex: 1; padding: 8px 12px 8px; display: flex; flex-direction: column; gap: 6px; }

  .lbl { font-family: var(--cond); font-weight: 700; font-size: clamp(21px, 6.6vw, 26px); letter-spacing: .02em; }

  .field { display: flex; align-items: center; gap: 10px; }
  .field .lbl { flex: none; }
  .pair { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 10px; }
  select {
    flex: 1; min-width: 0; width: 100%; height: clamp(48px, 6.9vh, 56px); border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--white); font: 700 clamp(21px, 6.4vw, 25px) var(--cond); padding: 0 26px 0 10px;
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--lilac) 50%), linear-gradient(135deg, var(--lilac) 50%, transparent 50%);
    background-position: calc(100% - 17px) 21px, calc(100% - 11px) 21px; background-size: 6px 6px; background-repeat: no-repeat;
  }
  select.locked { color: var(--lilac); background-image: none; border-style: dashed; pointer-events: none; padding-right: 8px; }
  .field.lockable { cursor: pointer; }

  hr { border: 0; height: 3px; background: var(--line); margin: 4px 0; border-radius: 2px; }

  .stopcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stopcard > div { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 10px;
    border-bottom: 1px solid var(--line); min-height: clamp(44px, 6.2vh, 51px); }
  .stopcard > div:nth-child(odd) { border-right: 3px solid var(--line); }
  .stopcard .val { font-family: var(--cond); font-weight: 700; font-size: clamp(28px, 9.4vw, 36px); color: var(--orange); white-space: nowrap; }
  .stopcard .nx .lbl, .stopcard .nx .val { color: var(--lilac); }
  .stopcard .stopname { justify-content: center; font-weight: 600; font-size: clamp(18px, 5.6vw, 21px); line-height: 1.15; text-align: center; padding: 4px 8px; min-height: clamp(48px, 6.9vh, 56px); }
  .stopcard .stopname.nx { color: var(--lilac); }
  .stopcard .run { grid-column: 1 / -1; border-right: 0 !important; border-bottom: 0; cursor: pointer; justify-content: flex-start; gap: 18px; }
  .run .val { color: var(--white) !important; font-size: 30px !important; }
  .hint { font-size: 13px; color: var(--muted); margin-left: auto; }

  .btn {
    position: relative; overflow: hidden; border-radius: 10px; border: 2px solid var(--orange);
    background: transparent; color: var(--orange); font-family: var(--cond); font-weight: 700; font-size: 24px;
    height: 52px; width: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .btn .fill { position: absolute; inset: 0; background: rgba(245,135,53,.35); transform: scaleX(0); transform-origin: left; }
  .btn.holding .fill { transform: scaleX(1); transition: transform 1s linear; }
  .btn span { position: relative; }
  .btn.off, .big.off { opacity: .35; }

  .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .counts h2 { margin: 0; text-align: center; font-family: var(--cond); font-weight: 700; font-size: 34px; line-height: 1.1; }
  .counts .in h2 { color: var(--lilac); }
  .counts .out h2 { color: var(--orange); }
  .box { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; height: clamp(70px, 11.5vh, 104px); position: relative; }
  .box input {
    width: 100%; height: 100%; border: 0; background: transparent; color: var(--white); text-align: center;
    font-family: var(--cond); font-weight: 700; font-size: 64px; outline: none; border-radius: 10px;
  }
  .box input:focus { box-shadow: inset 0 0 0 2px var(--lilac); }
  .box input::placeholder { color: var(--white); opacity: .3; }
  .out .box input:focus { box-shadow: inset 0 0 0 2px var(--orange); }
  .box.disabled { opacity: .4; }

  .big {
    height: 58px; border-radius: 10px; border: 0; font-family: var(--cond); font-weight: 700; font-size: 30px;
    color: var(--night); user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .big.in { background: var(--lilac); }
  .big.out { background: var(--orange); }
  .big:active:not(.off) { transform: scale(.98); }

  .status { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); padding: 2px 2px 0; }
  .status .warn { color: var(--orange); }
  .status .bad { color: var(--danger); }
  .banner { background: var(--orange); color: var(--night); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: 15px; display: none; }

  .overlay { position: fixed; inset: 0; background: rgba(10,10,35,.75); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .overlay.show { display: flex; }
  .dlg { background: var(--night); border: 2px solid var(--line); border-radius: 14px; width: 100%; max-width: 400px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .dlg h3 { margin: 0; font-family: var(--cond); font-size: 26px; }
  .dlg p { margin: 0; line-height: 1.4; }
  .dlg .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlg .actions.one { grid-template-columns: 1fr; }
  .dlg button.pri { background: var(--orange); color: var(--night); border: 0; }
  .dlg button { height: 48px; border-radius: 10px; font: 700 20px var(--cond); background: transparent; color: var(--white); border: 2px solid var(--line); }
  .dlg input[type=password], .dlg input[type=text] { height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--white); font: 600 22px var(--body); text-align: center; letter-spacing: .3em; }
  .dlg .menu { display: flex; flex-direction: column; gap: 10px; }
  .small { font-size: 13px; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .btn.holding .fill { transition: none; } }
</style>
</head>

<script>
/* ===== Settings to fill in ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbydFfJ0BIt7KphjfSscQOyUX8o0CF2EnsW096ASuM99mOneqW4KpRxba04_ZD291ghq/exec';
const API_KEY = '8pzJ8D0StgshTitWj1lvHhML';
const APP_VERSION = 'v1.5';   // cambiare ad ogni aggiornamento
/* =============================== */

const LS_STATE = 'uwa_state_v1', LS_QUEUE = 'uwa_queue_v1', LS_CFG = 'uwa_cfg_v1', LS_FAILED = 'uwa_failed_v1';
const MIN_GAP_MS = 20000;     // minimo tra due avanzamenti automatici
const MAX_ACCURACY = 60;      // metri: fix GPS meno precisi vengono ignorati
const DEPART_MARGIN = 20;     // metri oltre il raggio della fermata per dire "fermata lasciata"
const KEYPAD_CLOSE_MS = 5000;
const RESUME_GAP_MS = 30000;  // nessun GPS per 30 s (telefonata, app in secondo piano) = recupero fermate
const CATCHUP_MS = 15 * 60000;// per 15 minuti l'app cerca il bus anche nelle fermate successive
const CATCHUP_AHEAD = 8;      // quante fermate avanti guardare durante il recupero // il tastierino si chiude da solo 5 s dopo l'ultima cifra

const $ = id => document.getElementById(id);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let cfg = load(LS_CFG, null);
let state = load(LS_STATE, {});
let queue = load(LS_QUEUE, []);
let failed = load(LS_FAILED, []);
let lastFix = null, lastFixAt = 0, catchUpUntil = 0;
let flushing = false;
let wakeLock = null;

function todayStr() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function fmtDate(s) { const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; }
function persist() { save(LS_STATE, state); }

/* ---------- API ---------- */
async function apiGet(params) {
  const q = new URLSearchParams(Object.assign({ key: API_KEY }, params));
  const r = await fetch(API_URL + '?' + q.toString());
  return r.json();
}
async function apiPost(body) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ key: API_KEY }, body))
  });
  return r.json();
}

/* ---------- Structure helpers ---------- */
function block() { return cfg && cfg.blocks[state.shift === 'Afternoon' ? 1 : 0]; }
function runs() { const b = block(); return b ? (b.busRuns[state.busIndex] || []) : []; }
function stopsOfRun(run) { return block().seq.filter(s => run.times[s.num]); }
function stopName(s) { const c = cfg.stops && cfg.stops[s.num]; return (c && c.name) || s.name; }
function current() {
  const rs = runs(); const run = rs[state.runIdx]; if (!run) return null;
  const st = stopsOfRun(run)[state.stopIdx]; if (!st) return null;
  return { run, stop: st, time: run.times[st.num] };
}
function nextPos() {
  const rs = runs(); const run = rs[state.runIdx]; if (!run) return null;
  if (state.stopIdx + 1 < stopsOfRun(run).length) return { runIdx: state.runIdx, stopIdx: state.stopIdx + 1 };
  if (state.runIdx + 1 < rs.length) return { runIdx: state.runIdx + 1, stopIdx: 0 };
  return null;
}
function nextFrom(pos) {
  const rs = runs(), run = rs[pos.runIdx]; if (!run) return null;
  if (pos.stopIdx + 1 < stopsOfRun(run).length) return { runIdx: pos.runIdx, stopIdx: pos.stopIdx + 1 };
  if (pos.runIdx + 1 < rs.length) return { runIdx: pos.runIdx + 1, stopIdx: 0 };
  return null;
}
function aheadPositions(n) {
  const out = []; let p = { runIdx: state.runIdx, stopIdx: state.stopIdx };
  while (out.length < n && (p = nextFrom(p))) out.push(p);
  return out;
}
function stopAt(pos) { const run = runs()[pos.runIdx]; return stopsOfRun(run)[pos.stopIdx]; }
function totalRuns() { return cfg ? cfg.blocks.reduce((n, b) => n + ((b.busRuns[state.busIndex] || []).length), 0) : 0; }

/* ---------- Render ---------- */
function fillSelect(sel, items, placeholder, value) {
  sel.innerHTML = '';
  const o = document.createElement('option'); o.value = ''; o.textContent = placeholder; sel.appendChild(o);
  items.forEach(it => { const x = document.createElement('option'); x.value = it.value; x.textContent = it.label; sel.appendChild(x); });
  sel.value = value || '';
}

function tick() {
  $('ver').textContent = APP_VERSION;
  const d = new Date(), p = n => String(n).padStart(2, '0');
  $('date').textContent = fmtDate(todayStr());
  $('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
setInterval(tick, 1000);

/* Quale valore mostra il campo OUT:
   'pending'  = fermata lasciata, la prossima ha l'OUT (chi scende lungo la strada / alla prossima fermata)
   'outTyped' = siamo alla fermata con l'OUT
   null       = OUT spento */
function outKey() {
  const cur = state.active ? current() : null; if (!cur) return null;
  const nxt = nextPos(), nextStop = nxt ? stopAt(nxt) : null;
  /* 'pending': dal momento in cui si lascia una fermata (questa o una precedente, anche senza OUT)
     fino all'arrivo alla prossima fermata con OUT, il campo resta acceso per chi scende lungo la strada */
  if (state.awaitingOut && state.departed && nextStop && nextStop.hasOut) return 'pending';
  if (cur.stop.hasOut && !state.departed) return 'outTyped';   // siamo fermi qui con l'OUT: acceso finché non si riparte
  return null;
}

function render() {
  tick();
  const banner = $('banner');
  if (!cfg) { banner.style.display = 'block'; banner.textContent = 'No connection: the app needs to download the timetable once. Check signal and reopen.'; }
  else if (!cfg.serviceDay) { banner.style.display = 'block'; banner.textContent = 'No service today (weekend). Settings only.'; }
  else banner.style.display = 'none';

  if (cfg) {
    fillSelect($('driver'), cfg.drivers.map(n => ({ value: n, label: n })), 'Select driver', state.driver);
    fillSelect($('bus'), cfg.buses.map(b => ({ value: b.name, label: b.name })), 'Bus', state.bus);
  }
  $('shift').value = state.shift || '';
  ['driver', 'bus', 'shift'].forEach(id => { $(id).classList.toggle('locked', !!state.active); $(id).tabIndex = state.active ? -1 : 0; $(id).parentElement.classList.toggle('lockable', !!state.active); });

  const cur = state.active ? current() : null;
  const nxt = state.active ? nextPos() : null;
  const nextStop = nxt ? stopAt(nxt) : null;

  $('stopNum').textContent = cur ? cur.stop.num : '–';
  $('stopName').textContent = cur ? stopName(cur.stop) : (state.active ? 'Shift completed' : '–');
  $('stopTime').textContent = cur ? cur.time : '–';
  $('nextNum').textContent = nextStop ? nextStop.num : '–';
  $('nextName').textContent = nextStop ? stopName(nextStop) : (cur ? 'End of shift' : '–');
  $('nextTime').textContent = nextStop ? runs()[nxt.runIdx].times[nextStop.num] : '–';
  $('runNum').textContent = cur ? cur.run.run + ' / ' + totalRuns() : '–';

  const ok = outKey();
  if (typingField !== 'inVal') $('inVal').value = state.active ? (state.inVal || 0) : 0;   // non toccare il campo mentre si sta scrivendo
  $('inVal').disabled = !cur;
  $('inBox').classList.toggle('disabled', !cur);
  if (typingField !== 'outVal') $('outVal').value = ok ? (state[ok] || 0) : 0;   // idem per OUT
  $('outVal').disabled = !ok;
  $('outBox').classList.toggle('disabled', !ok);

  $('plusIn').classList.toggle('off', !cur || typingField === 'inVal');
  $('minusOut').classList.toggle('off', !ok || typingField === 'outVal');   // inibito mentre si scrive il numero a mano
  $('nextBtn').classList.toggle('off', !(cur && nxt));
  $('endBtn').classList.toggle('off', !state.active);
  renderSync(); renderGps();
}

function renderSync() {
  const el = $('sync');
  if (failed.length) { el.className = 'bad'; el.textContent = failed.length + ' not saved – see settings'; }
  else if (queue.length) { el.className = 'warn'; el.textContent = queue.length + ' waiting to send'; }
  else { el.className = ''; el.textContent = 'All data sent ✓'; }
}

function renderGps() {
  const el = $('gps');
  if (!lastFix) { el.textContent = 'GPS searching…'; return; }
  let t = 'GPS ±' + Math.round(lastFix.acc) + ' m';
  const nxt = state.active ? nextPos() : null;
  if (nxt && state.debug) {
    const s = stopAt(nxt), c = cfg.stops[s.num];
    t += (c && c.lat != null) ? ' · Stop ' + s.num + ' in ' + Math.round(dist(lastFix, c)) + ' m' : ' · Stop ' + s.num + ' has no position';
  }
  el.textContent = t;
}

/* ---------- Dialogs ---------- */
function dialog(html, wire) {
  $('dlg').innerHTML = html; $('overlay').classList.add('show');
  const close = () => $('overlay').classList.remove('show');
  if (wire) wire(close);
  return close;
}
function confirmBox(title, text, okLabel) {
  return new Promise(res => dialog(
    '<h3>' + title + '</h3><p>' + text + '</p><div class="actions"><button id="dNo">Cancel</button><button class="pri" id="dYes">' + okLabel + '</button></div>',
    close => { $('dNo').onclick = () => { close(); res(false); }; $('dYes').onclick = () => { close(); res(true); }; }));
}
function confirmHold(title, text, holdLabel) {
  return new Promise(res => dialog(
    '<h3>' + title + '</h3><p>' + text + '</p><div class="actions"><button id="dNo">Cancel</button>' +
    '<button class="pri btn" id="dHold" style="height:48px;font-size:20px;position:relative"><div class="fill"></div><span>' + holdLabel + '</span></button></div>',
    close => {
      $('dNo').onclick = () => { close(); res(false); };
      longPress($('dHold'), () => { close(); res(true); });
    }));
}
function info(title, text) {
  return new Promise(res => dialog('<h3>' + title + '</h3><p>' + text + '</p><div class="actions one"><button class="pri" id="dOk">OK</button></div>',
    close => { $('dOk').onclick = () => { close(); res(); }; }));
}
function waitBox(title, text) {
  // Finestra bloccante senza pulsanti: resta aperta finche' non viene chiusa da codice.
  $('dlg').innerHTML = '<h3>' + title + '</h3><p>' + text + '</p>';
  $('overlay').classList.add('show');
}
function closeWaitBox() { $('overlay').classList.remove('show'); }

/* ---------- Shift flow ---------- */
async function maybeStart() {
  if (state.active || !cfg) return;
  state.driver = $('driver').value; state.bus = $('bus').value; state.shift = $('shift').value;
  const b = cfg.buses.find(x => x.name === state.bus);
  state.busIndex = b ? b.index : null;
  persist();
  if (!state.driver || !state.bus || !state.shift) return;
  if (!cfg.serviceDay) { await info('No service today', 'The app can only record passengers Monday to Friday.'); return; }
  if (!runs().length) { await info('No runs found', 'The timetable has no runs for ' + state.bus + ' in the ' + state.shift + ' shift.'); return; }
  const now = new Date();
  const expected = now.getHours() < 12 ? 'Morning' : 'Afternoon';
  let text = state.shift + ' shift on ' + state.bus + ' for ' + state.driver + '.';
  if (state.shift !== expected) text += '<br><br><b style="color:var(--orange)">It is ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') + '. Are you sure it is the ' + state.shift + ' shift?</b>';
  const ok = await confirmHold('Start shift?', text, 'Hold to confirm');
  if (!ok) return;
  Object.assign(state, { active: true, date: todayStr(), runIdx: 0, stopIdx: 0, inVal: 0, outTyped: 0, outRoad: 0, pending: 0, lastAdvance: 0, recorded: 0, atStop: false, departed: false, awaitingOut: false, lockedOnFirst: true });   // resta sulla prima fermata del turno finché non la si raggiunge davvero
  persist(); render(); requestWake();
}

/* Tocco su DRIVER/BUS/SHIFT bloccati: correzione se non ci sono ancora dati */
['driver', 'bus', 'shift'].forEach(id => $(id).parentElement.addEventListener('click', async () => {
  if (!state.active) return;
  if (state.recorded) {
    return info('Shift already recording', 'Data has already been saved for this shift. To change driver, bus or shift, press END SHIFT and start again.');
  }
  if (await confirmBox('Change selection?', 'No data has been recorded yet. You can choose driver, bus and shift again.', 'Change')) {
    Object.assign(state, { active: false, runIdx: 0, stopIdx: 0, inVal: 0, outTyped: 0, outRoad: 0, pending: 0 });
    persist(); render(); releaseWake();
  }
}));

function commitCurrent(via) {
  const cur = current(); if (!cur) return;
  const out = cur.stop.hasOut ? (state.outTyped || 0) + (state.outRoad || 0) : 0;
  queue.push({
    action: 'write', id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    date: state.date, bus: state.bus, shift: state.shift, driver: state.driver,
    row: cur.run.row, run: cur.run.run, stop: cur.stop.num, in: state.inVal || 0, out: out, via: via
  });
  save(LS_QUEUE, queue);
  state.recorded = (state.recorded || 0) + 1;
}

function advance(via, quiet) {
  const nxt = nextPos(); if (!nxt) return;
  commitCurrent(via);
  state.runIdx = nxt.runIdx; state.stopIdx = nxt.stopIdx;
  const cur = current();
  state.inVal = 0; state.outRoad = 0;
  state.outTyped = (cur && cur.stop.hasOut) ? (state.pending || 0) : 0;   // chi è sceso lungo la strada resta nel campo OUT
  state.pending = 0;
  state.atStop = via === 'gps'; state.departed = false;
  state.awaitingOut = !(cur && cur.stop.hasOut);   // arrivati su una fermata senza OUT: resta in attesa della prossima con OUT
  state.lockedOnFirst = false;   // raggiunta la prima fermata del turno: il GPS torna a seguire il percorso normalmente
  state.lastAdvance = Date.now();
  persist(); if (quiet) return;
  render(); flush();
  if (navigator.vibrate) navigator.vibrate(120);
}

async function endShift() {
  if (!state.active) return;
  const ok = await confirmBox('End shift?', 'The numbers of the current stop will be saved and the shift closed.', 'End shift');
  if (!ok) return;
  commitCurrent('end');
  Object.assign(state, { active: false, runIdx: 0, stopIdx: 0, inVal: 0, outTyped: 0, outRoad: 0, pending: 0, driver: '', shift: '' });
  persist(); render(); releaseWake();
  if (queue.length) {
    waitBox('Sending…', "Don't close the app. Sending the last data to the sheet.");
    await flush();
    while (queue.length) { await new Promise(r => setTimeout(r, 3000)); await flush(); }
    closeWaitBox();
  } else flush();
}

/* ---------- Sending ---------- */
async function flush() {
  if (flushing || !queue.length || API_URL.startsWith('PASTE')) { renderSync(); return; }
  flushing = true;
  try {
    while (queue.length) {
      const item = queue[0];
      let res;
      try { res = await apiPost(item); } catch (e) { break; }        // niente rete: riprova dopo
      if (!res.ok) {
        /* Rifiuto del server: quasi sempre un invio disturbato (segnale debole).
           Riprova da solo fino a 5 volte; solo dopo lo mette in "not saved". */
        item.tries = (item.tries || 0) + 1; item.error = res.error;
        if (item.tries < 5) { save(LS_QUEUE, queue); break; }
        queue.shift(); failed.push(item); save(LS_FAILED, failed);
      } else queue.shift();
      save(LS_QUEUE, queue); renderSync();
    }
  } finally { flushing = false; renderSync(); }
}
setInterval(flush, 15000);
window.addEventListener('online', flush);

/* ---------- GPS ---------- */
function dist(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function onFix(p) {
  const now = Date.now();
  if (lastFixAt && now - lastFixAt > RESUME_GAP_MS) catchUpUntil = now + CATCHUP_MS;
  lastFixAt = now;
  lastFix = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
  renderGps();
  if (!state.active || !cfg || lastFix.acc > MAX_ACCURACY) return;
  /* Fermata attuale: prima "arrivato", poi "lasciata" (serve per accendere l'OUT solo dopo la partenza) */
  const cur = current(), c0 = cur && cfg.stops[cur.stop.num];
  if (c0 && c0.lat != null && c0.lon != null && !state.departed) {
    const d0 = dist(lastFix, c0), r0 = c0.radius || 40;
    if (d0 <= r0 + 15) { if (!state.atStop) { state.atStop = true; persist(); } }
    else if (state.atStop && d0 > r0 + Math.max(DEPART_MARGIN, lastFix.acc)) { state.departed = true; state.awaitingOut = true; persist(); render(); }
  }
  if (Date.now() - (state.lastAdvance || 0) < MIN_GAP_MS) return;
  /* Appena iniziato il turno: ignora qualunque altra fermata, anche se il GPS vi si trova già sopra
     (es. bus parcheggiato a Claremont Campus per il cambio turno, ma il run pomeridiano parte da un'altra fermata).
     La prima fermata (stopIdx 0) è già quella corrente fin dallo start: basta restare fermi lì senza mai
     chiamare advance(), che passerebbe invece a quella successiva. Si sblocca al VERO arrivo fisico sulla
     prima fermata (state.atStop, già impostato poco sopra in questa stessa chiamata), non quando si riparte. */
  if (state.lockedOnFirst) {
    if (state.atStop) state.lockedOnFirst = false;
    return;
  }
  /* Di norma guarda solo la prossima fermata; dopo una pausa del GPS anche quelle successive */
  let catchUp = Date.now() < catchUpUntil;
  if (catchUp && c0 && c0.lat != null && dist(lastFix, c0) <= (c0.radius || 40)) catchUp = false;  // ancora alla fermata attuale
  const ahead = aheadPositions(catchUp ? CATCHUP_AHEAD : 1);
  for (let k = 0; k < ahead.length; k++) {
    const s = stopAt(ahead[k]), c = cfg.stops[s.num];
    if (cur && k > 0 && s.num === cur.stop.num) break;   // mai oltre un giro completo
    if (!c || c.lat == null || c.lon == null) continue;
    if (dist(lastFix, c) <= (c.radius || 40)) {
      for (let j = 0; j < k; j++) advance('skipped', true);   // fermate passate mentre l'app era ferma: 0
      advance(k ? 'gps-catchup' : 'gps');
      catchUpUntil = 0;
      return;
    }
  }
}
let watchId = null;
function startGps() {
  if (!('geolocation' in navigator)) return;
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onFix, () => { $('gps').textContent = 'GPS off – allow location'; },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
startGps();

/* ---------- Screen always on ---------- */
async function requestWake() {
  try { if ('wakeLock' in navigator && state.active) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (state.active) catchUpUntil = Date.now() + CATCHUP_MS;   // di ritorno da telefonata o altra app
    startGps(); requestWake(); flush();
  }
});

/* ---------- Inputs ---------- */
let typingField = null;   // 'inVal' o 'outVal' mentre il relativo tastierino numerico è aperto, altrimenti null
function numInput(el, keyFn) {
  let t = null;
  const arm = () => { clearTimeout(t); t = setTimeout(() => el.blur(), KEYPAD_CLOSE_MS); };
  el.addEventListener('focus', () => { typingField = el.id; el.placeholder = el.value; el.value = ''; arm(); render(); });
  el.addEventListener('input', () => {
    const key = keyFn(); if (!key) { el.blur(); return; }
    const v = el.value.replace(/\D/g, '').slice(0, 3);
    el.value = v; state[key] = Number(v || 0); persist(); arm();
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); el.blur(); } });
  el.addEventListener('blur', () => { clearTimeout(t); typingField = null; el.placeholder = ''; const key = keyFn(); el.value = key ? (state[key] || 0) : 0; render(); });
}
numInput($('inVal'), () => 'inVal');
numInput($('outVal'), outKey);
['driver', 'bus', 'shift'].forEach(id => $(id).addEventListener('change', maybeStart));

/* Long press (1 s) */
function longPress(el, action) {
  let t = null;
  const cancel = () => { clearTimeout(t); t = null; el.classList.remove('holding'); };
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('off')) return;
    el.classList.add('holding');
    t = setTimeout(() => { cancel(); action(); }, 1000);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
longPress($('nextBtn'), () => advance('manual'));
longPress($('endBtn'), endShift);

/* + IN / − OUT, e il menu Settings premendoli insieme */
const held = { plusIn: false, minusOut: false };
let suppressUntil = 0;
let wasTypingOnPress = null;   // il campo che stava ricevendo il numero appena PRIMA del tocco sul pulsante
['plusIn', 'minusOut'].forEach(id => {
  const el = $(id);
  el.addEventListener('pointerdown', () => {
    wasTypingOnPress = typingField;   // va letto qui: il tocco sul pulsante sposta subito il focus e
    held[id] = true;                  // chiude il tastierino (blur), azzerando typingField PRIMA del click
    if (held.plusIn && held.minusOut) { suppressUntil = Date.now() + 1200; openSettings(); }
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => { held[id] = false; }));
  el.addEventListener('contextmenu', e => e.preventDefault());
});
$('plusIn').addEventListener('click', () => {
  if (Date.now() < suppressUntil || $('plusIn').classList.contains('off') || wasTypingOnPress === 'inVal') return;
  state.inVal = (state.inVal || 0) + 1; persist(); render();
});
$('minusOut').addEventListener('click', () => {
  if (Date.now() < suppressUntil || $('minusOut').classList.contains('off') || wasTypingOnPress === 'outVal') return;
  const key = outKey(); if (!key) return;
  state[key] = (state[key] || 0) + 1; persist(); render();
});

/* ---------- Run / stop correction ---------- */
$('runLine').addEventListener('click', () => {
  if (!state.active) return;
  const rs = runs();
  const runOpts = rs.map((r, i) => {
    const f = stopsOfRun(r)[0];
    return '<option value="' + i + '"' + (i === state.runIdx ? ' selected' : '') + '>Run ' + r.run + ' – ' + r.times[f.num] + ' from Stop ' + f.num + '</option>';
  }).join('');
  dialog('<h3>Correct position</h3><p class="small">Use this if a run was skipped or the app is on the wrong stop. The numbers already typed stay and will be saved on the new stop.</p>' +
    '<select id="cRun">' + runOpts + '</select><select id="cStop"></select>' +
    '<div class="actions"><button id="cNo">Cancel</button><button class="pri" id="cOk">Apply</button></div>', close => {
      const fillStops = () => {
        const r = rs[Number($('cRun').value)];
        $('cStop').innerHTML = stopsOfRun(r).map((s, i) =>
          '<option value="' + i + '">Stop ' + s.num + ' ' + stopName(s) + ' – ' + r.times[s.num] + '</option>').join('');
        if (Number($('cRun').value) === state.runIdx) $('cStop').value = state.stopIdx;
      };
      $('cRun').onchange = fillStops; fillStops();
      $('cNo').onclick = close;
      $('cOk').onclick = () => {
        state.runIdx = Number($('cRun').value); state.stopIdx = Number($('cStop').value);
        state.atStop = false; state.departed = false; state.awaitingOut = false; state.lockedOnFirst = false;
        state.lastAdvance = Date.now(); persist(); close(); render();
      };
    });
});

/* ---------- Settings (PIN) ---------- */
function openSettings() {
  dialog('<h3>Settings</h3><p class="small">Enter the PIN.</p><input type="password" id="pin" inputmode="numeric" maxlength="8">' +
    '<div class="actions"><button id="pNo">Cancel</button><button class="pri" id="pOk">Open</button></div>', close => {
      setTimeout(() => $('pin').focus(), 50);
      $('pNo').onclick = close;
      $('pOk').onclick = async () => {
        const pin = $('pin').value;
        try {
          const r = await apiPost({ action: 'verifyPin', pin });
          if (!r.ok || !r.valid) { $('pin').value = ''; $('pin').placeholder = 'Wrong PIN'; return; }
          close(); settingsMenu(pin);
        } catch (e) { $('pin').value = ''; $('pin').placeholder = 'No connection'; }
      };
    });
}

function settingsMenu(pin) {
  const stopNums = Object.keys(cfg.stops).map(Number).sort((a, b) => a - b);
  const opts = stopNums.map(n => '<option value="' + n + '">Stop ' + n + ' ' + (cfg.stops[n].name || '') + '</option>').join('');
  dialog('<h3>Settings</h3><div class="menu">' +
    '<p class="small">Save current position as stop (stand at the stop). ' + (lastFix ? 'GPS accuracy ±' + Math.round(lastFix.acc) + ' m.' : 'No GPS fix yet.') + '</p>' +
    '<select id="sStop">' + opts + '</select><button id="sSave">Save current position</button>' +
    '<button id="sReload">Reload configuration</button>' +
    '<button id="sDebug">' + (state.debug ? 'Hide' : 'Show') + ' distance to next stop</button>' +
    (failed.length ? '<button id="sFailed">Show ' + failed.length + ' not saved</button>' : '') +
    '<button id="sReset">Reset shift on this phone</button>' +
    '</div><div class="actions one"><button class="pri" id="sClose">Close</button></div>', close => {
      $('sClose').onclick = close;
      $('sSave').onclick = async () => {
        if (!lastFix) return info('No GPS', 'Wait for a GPS fix and try again.');
        const stop = $('sStop').value;
        if (!await confirmBox('Save position?', 'Stop ' + stop + ' will be set to your current position (±' + Math.round(lastFix.acc) + ' m).', 'Save')) return settingsMenu(pin);
        try {
          const r = await apiPost({ action: 'savePos', pin, stop, lat: lastFix.lat, lon: lastFix.lon });
          if (!r.ok) return info('Not saved', r.error);
          await loadConfig(); info('Saved', 'Position of Stop ' + stop + ' saved.');
        } catch (e) { info('No connection', 'Position not saved. Try again with signal.'); }
      };
      $('sReload').onclick = async () => { close(); const ok = await loadConfig(); info(ok ? 'Updated' : 'No connection', ok ? 'Configuration reloaded.' : 'Could not reach the server.'); };
      $('sDebug').onclick = () => { state.debug = !state.debug; persist(); close(); render(); };
      if ($('sFailed')) $('sFailed').onclick = () => {
        const list = failed.map(f => 'Run ' + f.run + ' Stop ' + f.stop + ' IN ' + f.in + ' OUT ' + f.out + ': ' + f.error).join('<br>');
        dialog('<h3>Not saved</h3><p class="small">' + list + '</p><div class="actions"><button id="fClr">Clear list</button><button class="pri" id="fRetry">Retry</button></div>', c2 => {
          $('fClr').onclick = () => { failed = []; save(LS_FAILED, failed); c2(); render(); };
          $('fRetry').onclick = () => { queue = failed.concat(queue); failed = []; save(LS_FAILED, failed); save(LS_QUEUE, queue); c2(); flush(); render(); };
        });
      };
      $('sReset').onclick = async () => {
        if (!await confirmBox('Reset shift?', 'The current shift on this phone is cleared without saving the current stop. Data already recorded is kept.', 'Reset')) return settingsMenu(pin);
        state = { debug: state.debug }; persist(); render(); releaseWake();
      };
    });
}

/* ---------- Boot ---------- */
async function loadConfig() {
  if (API_URL.startsWith('PASTE')) return false;
  try {
    const r = await apiGet({ action: 'init', date: todayStr() });
    if (!r.ok) { info('Server error', r.error); return false; }
    cfg = r; save(LS_CFG, cfg); render(); return true;
  } catch (e) { return false; }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(function boot() {
  if (state.date && state.date !== todayStr()) {
    state = { debug: state.debug };            // nuovo giorno: turno azzerato, i dati in coda restano
    persist();
  }
  if (state.outRoad) { state.outTyped = (state.outTyped || 0) + state.outRoad; state.outRoad = 0; persist(); }
  render();
  if (state.active) { requestWake(); catchUpUntil = Date.now() + CATCHUP_MS; }
  loadConfig().then(() => { render(); flush(); });
})();
</script>
</body>
</html>
